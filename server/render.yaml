services:
  - type: web
    name: jigme-enterprise-backend
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://new44-six.vercel.app,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: jigme-db
          property: connectionString

databases:
  - name: jigme-db
    plan: free
    databaseName: jigme_enterprise
    user: jigme_admin
